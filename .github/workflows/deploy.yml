name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Sync code to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "."
          target: "/opt/stonks-in-motion/"
          strip_components: 0
          exclude: |
            .git
            .venv
            __pycache__
            *.pyc
            .pytest_cache
            .ruff_cache
            .coverage
            htmlcov
            logs
            .env
            deploy_key
            deploy_key.pub
            .github
            .idea
            .vscode

      - name: Write .env from secrets
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            umask 077
            cat > /opt/stonks-in-motion/.env <<EOF
            APP_HOST=0.0.0.0
            APP_PORT=8000
            LOG_LEVEL=INFO
            LOG_DIR=/opt/stonks-in-motion/logs
            FINNHUB_API_KEY=${{ secrets.FINNHUB_API_KEY }}
            FINNHUB_BASE_URL=https://finnhub.io/api/v1
            FINNHUB_TICKERS=["AAPL","MSFT","GOOG","AMZN","NVDA","TSLA"]
            FINNHUB_POLL_INTERVAL_SECONDS=10
            FINNHUB_REQUEST_TIMEOUT_SECONDS=10
            FINNHUB_MAX_RETRIES=3
            KAFKA_BOOTSTRAP_SERVERS=${{ secrets.AIVEN_KAFKA_HOST }}:${{ secrets.AIVEN_KAFKA_PORT }}
            KAFKA_SECURITY_PROTOCOL=SASL_SSL
            KAFKA_SASL_MECHANISM=PLAIN
            KAFKA_SASL_USERNAME=${{ secrets.AIVEN_KAFKA_USERNAME }}
            KAFKA_SASL_PASSWORD=${{ secrets.AIVEN_KAFKA_PASSWORD }}
            KAFKA_TOPIC=${{ secrets.AIVEN_KAFKA_TOPIC }}
            KAFKA_CLIENT_ID=stonks-in-motion
            KAFKA_TRANSPORT=native
            KAFKA_SSL_CA_LOCATION=/opt/stonks-in-motion/certs/ca.pem
            EOF
            chmod 600 /opt/stonks-in-motion/.env
            echo ".env written (mode 600)"

      - name: Write Aiven CA cert from secret
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # `AIVEN_CA_CERT` is optional; if unset, librdkafka will use the
          # system trust store (works for Aiven's Let's Encrypt chain).
          script: |
            set -euo pipefail
            CERT_PATH="/opt/stonks-in-motion/certs/ca.pem"
            if [[ -z "${{ secrets.AIVEN_CA_CERT }}" ]]; then
              echo "AIVEN_CA_CERT secret is empty; relying on system trust store"
              rm -f "$CERT_PATH"
              exit 0
            fi
            umask 077
            mkdir -p /opt/stonks-in-motion/certs
            printf '%s' "${{ secrets.AIVEN_CA_CERT }}" > "$CERT_PATH"
            chmod 600 "$CERT_PATH"
            echo "CA cert written to $CERT_PATH (mode 600)"

      - name: Install / update Python dependencies
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            cd /opt/stonks-in-motion
            if [ ! -d .venv ]; then
              python3 -m venv .venv
            fi
            .venv/bin/pip install --quiet --upgrade pip
            .venv/bin/pip install --quiet -r requirements.txt

      - name: Reinstall systemd unit if changed
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            LOCAL="/opt/stonks-in-motion/deploy/stonks-in-motion.service"
            REMOTE="/etc/systemd/system/stonks-in-motion.service"
            if cmp -s "$LOCAL" "$REMOTE"; then
              echo "Unit unchanged, skipping reinstall"
              exit 0
            fi
            echo "Unit changed; reinstalling"
            # `sudo -n` so we fail fast (no password prompt). Requires the
            # matching NOPASSWD rules installed by deploy/bootstrap.sh.
            if ! sudo -n install -m 644 "$LOCAL" "$REMOTE" 2>/dev/null; then
              echo "::warning::sudo install failed; run deploy/bootstrap.sh as root to refresh sudoers"
              exit 0
            fi
            if ! sudo -n systemctl daemon-reload 2>/dev/null; then
              echo "::warning::sudo systemctl daemon-reload failed; run deploy/bootstrap.sh as root to refresh sudoers"
              exit 0
            fi
            echo "Unit reinstalled and daemon reloaded"

      - name: Restart service and wait for healthy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            sudo systemctl restart stonks-in-motion
            # Wait up to ~15s for the app to respond.
            for i in $(seq 1 15); do
              if curl -fsS http://127.0.0.1:8000/healthz >/dev/null; then
                echo "Health check passed after ${i}s"
                sudo systemctl is-active stonks-in-motion
                exit 0
              fi
              sleep 1
            done
            echo "Health check failed; recent logs:" >&2
            sudo journalctl -u stonks-in-motion --no-pager -n 100 >&2
            exit 1
