<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ app_name }}</title>
    <style>
        :root { color-scheme: light dark; }
        * { box-sizing: border-box; }
        body {
            font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            max-width: 960px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        h1 { font-weight: 600; margin-bottom: 0.25rem; }
        .subtitle { color: #888; margin-top: 0; }
        .controls { display: flex; gap: 0.5rem; margin: 1.5rem 0 1rem; }
        button {
            padding: 0.5rem 1rem;
            border: 1px solid currentColor;
            background: transparent;
            color: inherit;
            border-radius: 4px;
            cursor: pointer;
            font: inherit;
        }
        button:disabled { opacity: 0.4; cursor: not-allowed; }
        button.primary { background: #1f883d; color: white; border-color: #1f883d; }
        button.danger  { background: #cf222e; color: white; border-color: #cf222e; }
        .panel {
            padding: 0.75rem 1rem;
            border: 1px solid color-mix(in srgb, currentColor 20%, transparent);
            border-radius: 6px;
            margin: 1rem 0;
        }
        .panel .row {
            display: flex;
            justify-content: space-between;
            padding: 0.25rem 0;
        }
        .panel .label { color: #888; }
        pre {
            background: color-mix(in srgb, currentColor 8%, transparent);
            padding: 0.75rem;
            border-radius: 6px;
            overflow: auto;
            max-height: 320px;
            font-size: 12px;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 0.5rem;
            vertical-align: middle;
        }
        .dot.on  { background: #1f883d; }
        .dot.off { background: #888; }
    </style>
</head>
<body>
    <h1>{{ app_name }}</h1>
    <p class="subtitle">Finnhub &rarr; Aiven Kafka streaming pipeline</p>

    <div class="controls">
        <button id="start" class="primary">Start Stream</button>
        <button id="stop"  class="danger">Stop Stream</button>
    </div>

    <div class="panel">
        <div class="row">
            <span class="label">Producer</span>
            <span id="producer-state"><span class="dot off"></span>stopped</span>
        </div>
        <div class="row">
            <span class="label">Consumer</span>
            <span id="consumer-state"><span class="dot off"></span>stopped</span>
        </div>
        <div class="row">
            <span class="label">Uptime</span>
            <span id="uptime">&mdash;</span>
        </div>
    </div>

    <h2>Recent messages</h2>
    <pre id="log">(no messages yet &mdash; consumer log tail appears here in V1d)</pre>

    <script src="/static/app.js"></script>
</body>
</html>
